<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <style>
    * { margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    canvas {
      display: block;
      position: fixed;
      inset: 0;
      touch-action: none;
      /* 无边框 */
    }
  </style>
  </head>
<body>
  <canvas id="p"></canvas>
  <script>
    const canvas = document.getElementById("p");
    const ctx = canvas.getContext("2d");
    let W = 0, H = 0;

    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      W = window.innerWidth;
      H = window.innerHeight;

      canvas.width  = W * dpr;
      canvas.height = H * dpr;
      canvas.style.width  = W + "px";
      canvas.style.height = H + "px";

      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function draw() {
	    var n1=Math.random() * 255;
	    var n2=Math.random() * 255;
	    var n3=Math.random() * 255;
	    ctx.fillStyle = `rgb(${n1},${n2},${n3})`;
      ctx.fillRect(0, 0, W, H);
	    setTimeout(draw,50);
    }

    function onResize() {
      resize();
      draw();                     // ✅ 关键：resize 后重画
    }

    window.addEventListener("resize", onResize);

    // 初始化
    resize();
    draw();
  </script>
</body>
</html>
