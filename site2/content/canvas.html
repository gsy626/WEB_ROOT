<!DOCTYPE html>
<head>
<style>
canvas
{
	border: thin solid black;
}
</style>
</head>
<body>
<canvas id="p1" width="200" height="200"></canvas>
<canvas id="p2" width="200" height="200"></canvas>
<script>
function draw()
{
	/** @type {HTMLCanvasElement} */
	var canvas = document.getElementById("p1");
	const ctx = canvas.getContext("2d");
	var i = 100;
	ctx.fillStyle =`rgba(${i},0,0,0.9)`;
	var aa=new Path2D();
	aa.rect(20,20,20,20);
	ctx.fill(aa);
	ctx.fillStyle = "rgba(0,200,0,0.9)";
	ctx.fillRect(30,30,20,20);
	ctx.strokeStyle = "rgba(0,0,200,0.9)";
	ctx.strokeRect(30,30,20,20);
	ctx.clearRect(0,0,30,30);
	
	var a=new Path2D();
	a.moveTo(100,100);
	a.lineTo(150,150);
	a.lineTo(150,50);
	a.closePath();
	ctx.stroke(a);
	ctx.fill(a);
	var b=new Path2D();	
	b.arc(20,100,30,0,(Math.PI * 7 / 4),false);
	ctx.fill(b);
	ctx.stroke(b);

	var canvas2=document.getElementById("p2");
	var ctx2=canvas2.getContext("2d");
	var ran=Math.random() * 255;
	for(let i=0;i<10;i++)
	{
		for(let j=0;j<10;j++)
		{
			ctx2.fillStyle=`rgb(${Math.floor(255 - 25 * i)},${Math.floor(255 - 25 * j)},${ran})`;
			ctx2.fillRect(20 *i,20 * j,20,20);
		}
	}
	setTimeout(draw,1000);
}
window.addEventListener("load",draw);
</script>
</body>
