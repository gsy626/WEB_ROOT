<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1b4ed8">
  <meta id="pageDescription" name="description" content="河北省保定市清苑区第一中学主题图片合成小游戏">
  <title>合成清苑一中</title>
  <link rel="icon" href="assets/logo.png" type="image/png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <img class="brand-logo" src="assets/logo.png" alt="" width="34" height="34">
        <div class="brand-copy">
          <h1 id="gameTitle">合成清苑一中</h1>
          <p>左右拖动 · 松手落下</p>
        </div>
      </div>

      <div class="metric metric-score">
        <span>得分</span>
        <strong id="score">0</strong>
      </div>

      <div class="metric">
        <span>最高</span>
        <strong id="bestScore">0</strong>
      </div>

      <div class="header-actions">
        <button
          class="icon-button"
          id="soundButton"
          type="button"
          tabindex="-1"
          aria-label="关闭声音"
          aria-pressed="true"
        >
          <span class="sound-icon" id="soundIcon" aria-hidden="true"></span>
        </button>
        <button class="small-button restart-button" id="restartButton" type="button" tabindex="-1" disabled>重开</button>
      </div>
    </header>

    <div class="board">
      <canvas
        id="gameCanvas"
        width="640"
        height="992"
      ></canvas>

      <div
        class="overlay"
        id="gameOverOverlay"
        role="dialog"
        aria-modal="true"
        aria-labelledby="gameOverTitle"
        aria-describedby="gameOverMessage"
        hidden
      >
        <div class="overlay-card confirm-card">
          <h2 id="gameOverTitle">本局结束</h2>
          <p class="confirm-copy" id="gameOverMessage">差一点就更大了</p>
          <div class="result-row">
            <div>
              <span>等级</span>
              <div class="highest-item">
                <img id="highestItemImage" alt="">
              </div>
            </div>
            <div><span>得分</span><strong id="finalScore">0</strong></div>
          </div>
          <p class="new-record" id="newRecord" hidden>新纪录！</p>

          <div class="rank-panel" id="rankPanel">
            <p class="rank-hint" id="rankHint">登录后可将本局成绩计入排行榜</p>
            <p class="rank-result" id="rankResult" role="status" hidden></p>
            <div class="rank-actions">
              <button class="small-button rank-primary" id="rankLoginButton" type="button">登录并上榜</button>
              <button class="small-button" id="rankRetryButton" type="button" hidden>重新提交</button>
              <button class="small-button" id="rankViewButton" type="button">看排行榜</button>
            </div>
          </div>

          <div class="confirm-actions game-over-actions">
            <button class="small-button confirm-button" id="againButton" type="button" tabindex="-1">再合一次</button>
          </div>
        </div>
      </div>

      <div
        class="overlay"
        id="restartConfirmOverlay"
        role="dialog"
        aria-modal="true"
        aria-labelledby="restartConfirmTitle"
        hidden
      >
        <div class="overlay-card confirm-card">
          <h2 id="restartConfirmTitle">重新开始？</h2>
          <p class="confirm-copy">当前进度将会丢失</p>
          <div class="confirm-actions">
            <button class="small-button" id="restartCancelButton" type="button" tabindex="-1">取消</button>
            <button class="small-button confirm-button" id="restartConfirmButton" type="button" tabindex="-1">重新开始</button>
          </div>
        </div>
      </div>

      <div
        class="overlay"
        id="leaderboardOverlay"
        role="dialog"
        aria-modal="true"
        aria-labelledby="leaderboardTitle"
        hidden
      >
        <div class="overlay-card leaderboard-card">
          <div class="overlay-head">
            <div>
              <h2 id="leaderboardTitle">排行榜</h2>
              <p class="overlay-sub" id="leaderboardSub">按最高分排名 · 登录后参与</p>
            </div>
            <button class="overlay-close" id="leaderboardCloseButton" type="button" aria-label="关闭排行榜">×</button>
          </div>

          <div class="leaderboard-me" id="leaderboardMe" hidden></div>
          <div class="leaderboard-list" id="leaderboardList">
            <p class="leaderboard-empty">加载中…</p>
          </div>

          <div class="leaderboard-actions">
            <button class="small-button" id="leaderboardRefreshButton" type="button">刷新</button>
            <button class="small-button confirm-button" id="leaderboardLoginButton" type="button">登录 / 注册</button>
            <button class="small-button" id="leaderboardLogoutButton" type="button" hidden>退出登录</button>
          </div>
          <p class="leaderboard-note">只收录登录玩家提交的最高分。同名成绩按先达到者在前。</p>
        </div>
      </div>

      <div
        class="overlay"
        id="authOverlay"
        role="dialog"
        aria-modal="true"
        aria-labelledby="authTitle"
        hidden
      >
        <div class="overlay-card auth-card">
          <div class="overlay-head">
            <div>
              <h2 id="authTitle">登录</h2>
              <p class="overlay-sub" id="authSub">登录后，你的最高分会出现在排行榜上</p>
            </div>
            <button class="overlay-close" id="authCloseButton" type="button" aria-label="关闭登录窗口">×</button>
          </div>

          <div class="auth-tabs" role="tablist" aria-label="登录或注册">
            <button class="auth-tab is-active" id="authLoginTab" type="button" role="tab" aria-selected="true">登录</button>
            <button class="auth-tab" id="authRegisterTab" type="button" role="tab" aria-selected="false">注册</button>
          </div>

          <form id="authForm" novalidate>
            <label class="field">
              <span>用户名</span>
              <input id="authUsername" name="username" type="text" maxlength="20" autocomplete="username" required placeholder="2–20 个字符">
            </label>
            <label class="field">
              <span>密码</span>
              <input id="authPassword" name="password" type="password" maxlength="72" autocomplete="current-password" required placeholder="至少 6 位">
            </label>
            <label class="field" id="authPasswordConfirmField" hidden>
              <span>确认密码</span>
              <input id="authPasswordConfirm" name="passwordConfirm" type="password" maxlength="72" autocomplete="new-password" placeholder="再输入一次">
            </label>
            <p class="form-hint" id="authHint">支持中文、字母、数字、下划线；密码至少 6 位。</p>
            <p class="form-error" id="authError" role="alert" hidden></p>
            <button class="small-button confirm-button auth-submit" id="authSubmit" type="submit">登录</button>
          </form>
        </div>
      </div>
    </div>

    <footer class="app-footer">
      <div class="footer-actions">
        <button class="small-button leaderboard-button" id="leaderboardButton" type="button">排行榜</button>
        <button class="small-button account-button" id="accountButton" type="button">登录 / 注册</button>
      </div>
      <p class="footer-note">
        ds 制作 · 非官方同人小游戏 · 图片来自清苑一中师生 ·
        河北省保定市清苑区第一中学
      </p>
    </footer>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  </main>

  <script src="game-config.js"></script>
  <script>
    window.QYYZ_LEADERBOARD_CONFIG = {
      apiCandidates: ["api.php"]
    };
  </script>
  <script src="leaderboard.js"></script>
  <script src="game.js"></script>
</body>
</html>
